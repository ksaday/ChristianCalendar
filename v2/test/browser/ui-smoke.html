<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbath Calendar v2 — UI smoke tests</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; }
  table { border-collapse: collapse; margin-top: 1rem; } td, th { border: 1px solid #ccc; padding: 4px 8px; vertical-align: top; }
  .pass { color: #2d6a2d; } .fail { color: #8b1a1a; font-weight: 700; }
  iframe { width: 1200px; height: 700px; border: 1px solid #999; margin-top: 1rem; }
</style>
</head>
<body>
<h1>UI smoke tests (T-UI-01 … T-UI-18, zero dependencies)</h1>
<p id="status">Running…</p>
<table id="results"><thead><tr><th>ID</th><th>Check</th><th>Result</th></tr></thead><tbody></tbody></table>
<iframe id="app" src="../../index.html#j=2461317&z=week" title="application under test"></iframe>
<script type="module">
  const results = [];
  const tbody = document.querySelector('#results tbody');
  const record = (id, check, ok, detail = '') => {
    results.push({ id, check, ok, detail });
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${id}</td><td>${check}</td><td class="${ok ? 'pass' : 'fail'}">${ok ? 'pass' : 'FAIL'} ${detail}</td>`;
    tbody.appendChild(tr);
  };
  const frame = document.getElementById('app');
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const waitFor = async (fn, ms = 3000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { try { if (fn()) return true; } catch {} await sleep(30); } return false; };
  await new Promise(r => frame.addEventListener('load', r, { once: true }));
  const w = frame.contentWindow, d = frame.contentDocument;
  const $ = (id) => d.getElementById(id);
  const rowsSnapshot = () => [...d.querySelectorAll('#rows g.row')].map(g => g.textContent).join('|');
  const cardText = () => $('cursorCard').textContent;
  // after a hash change the app re-renders; wait until the zoom label matches the requested level and the SVG was rebuilt
  const levelLabel = (z) => ({ day: 'Day', week: 'Week', month: 'Month', year: 'Year', decade: 'Decade', century: 'Century', millennium: 'Millennium' }[z] || z.replace(/^e(\d+)$/, '10^$1 years'));
  const setHash = async (h) => {
    const marker = d.querySelector('#rows > title'); if (marker) marker.remove();
    w.location.hash = h;
    const z = /z=([a-z0-9]+)/.exec(h)[1];
    await waitFor(() => d.querySelector('#rows > title') && $('zoomLabel').textContent === levelLabel(z), 5000);
    await sleep(30);
  };
  const settle = async () => { const marker = d.querySelector('#rows > title'); if (marker) marker.remove(); await waitFor(() => d.querySelector('#rows > title'), 5000); };

  try {
    await waitFor(() => $('integrity').textContent.includes('✓'));
    record('T-VER-01', 'integrity panel shows the self-test passed', $('integrity').textContent.includes('✓'), $('integrity').textContent);

    // T-UI-05: hash restores the view
    record('T-UI-05', 'initial hash #j=2461317&z=week sets the cursor to Sabbath #104,017', cardText().includes('Sabbath #104,017') && $('zoomLabel').textContent === 'Week');

    // T-UI-06 + T-UI-01: go-to by Sabbath number (negative, large) relabels every row
    const before = rowsSnapshot();
    $('gotoBtn').click(); await waitFor(() => $('gotoDialog').open && d.querySelector('#gotoFields input'));
    const inp = d.querySelector('#gotoFields input'); inp.value = '-1000000000000'; inp.dispatchEvent(new Event('input', { bubbles: true }));
    const previewOk = await waitFor(() => $('gotoPreview').textContent.includes('Sabbath #−1,000,000,000,000'));
    $('gotoGo').click(); await waitFor(() => w.location.hash.includes('j=-6999998266802')); await sleep(100);
    const after = rowsSnapshot();
    record('T-UI-01', 'go-to Sabbath #−10^12: preview, cursor card, hash', previewOk && cardText().includes('Sabbath #−1,000,000,000,000') && w.location.hash.includes('j=-6999998266802'), w.location.hash);
    record('T-UI-06', 'every row re-labelled after the jump; calendar rows collapsed with reasons', before !== after && after.split('|').filter(t => t.includes('unsupported here')).length >= 3);
    const sabbathRowExact = d.querySelector('#rows g.row-sabbath .seal.pre') !== null;
    record('T-UI-09', 'negative seals use the grey "pre" style', sabbathRowExact);

    // T-UI-02: civil-date lookup in BC (Gregorian vs Julian give different JDNs; preview names the calendar)
    $('gotoBtn').click(); await waitFor(() => $('gotoDialog').open);
    const pick = async (mode) => { const r = d.querySelector(`#gotoModes input[value="${mode}"]`); r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); await waitFor(() => d.querySelector('#gotoFields input[name=year]')); };
    await pick('gregorian');
    const f = () => $('gotoFields');
    f().querySelector('input[name=year]').value = '4004'; f().querySelector('select[name=era]').value = 'BC'; f().querySelector('select[name=month]').value = '10'; f().querySelector('input[name=day]').value = '23';
    f().querySelector('input[name=day]').dispatchEvent(new Event('input', { bubbles: true })); await waitFor(() => $('gotoPreview').textContent.includes('259,290'));
    const gregPreview = $('gotoPreview').textContent;
    await pick('julian');
    f().querySelector('input[name=year]').value = '4004'; f().querySelector('select[name=era]').value = 'BC'; f().querySelector('select[name=month]').value = '10'; f().querySelector('input[name=day]').value = '23';
    f().querySelector('input[name=day]').dispatchEvent(new Event('input', { bubbles: true })); await waitFor(() => $('gotoPreview').textContent.includes('259,258'));
    const julPreview = $('gotoPreview').textContent;
    $('gotoGo').click(); await waitFor(() => w.location.hash.includes('j=259258')); await sleep(100);
    record('T-UI-02', 'Gregorian 23 Oct 4004 BC → JDN 259,290; Julian 23 Oct 4004 BC → JDN 259,258; preview shows calendar + certainty',
      gregPreview.includes('259,290') && julPreview.includes('259,258') && julPreview.includes('conventional') && w.location.hash.includes('j=259258'), `${gregPreview.slice(0, 60)} / ${julPreview.slice(0, 60)}`);

    // T-UI-03: zoom through the whole ladder; tick count bounded; render time
    let maxTicks = 0, maxMs = 0, steps = 0;
    for (let i = 0; i < 60; i++) {
      const t0 = performance.now();
      const prevLabel = $('zoomLabel').textContent;
      w.document.dispatchEvent(new w.KeyboardEvent('keydown', { key: '-', bubbles: true }));
      await waitFor(() => $('zoomLabel').textContent !== prevLabel, 4000);   // the app renders on rAF (or a timer when hidden)
      maxMs = Math.max(maxMs, Number($('rows').dataset.renderMs || performance.now() - t0));
      maxTicks = Math.max(maxTicks, d.querySelectorAll('#rows [data-jdn]').length);
      steps++;
      if ($('zoomLabel').textContent === '10^40 years') break;
    }
    record('T-UI-03', `zoomed out through the ladder (${steps} steps, max ${maxTicks} labelled ticks, max render ${maxMs.toFixed(0)} ms)`, $('zoomLabel').textContent === '10^40 years' && maxTicks <= 400 && maxMs < 250);

    // T-UI-04: keyboard
    await setHash('#j=1733205&z=week');
    const press = async (init) => { const marker = d.querySelector('#rows > title'); if (marker) marker.remove(); w.document.dispatchEvent(new w.KeyboardEvent('keydown', { bubbles: true, ...init })); await waitFor(() => d.querySelector('#rows > title'), 5000); };
    await press({ key: 'ArrowRight', shiftKey: true });
    const afterShift = w.location.hash;
    await press({ key: 'ArrowLeft', altKey: true });
    const afterAlt = w.location.hash;
    await press({ key: 'Home' });
    const afterHome = w.location.hash;
    await press({ key: '+' });
    record('T-UI-04', 'Shift+→ = +7 days, Alt+← = −1 day, Home = #1, + zooms in', afterShift.includes('j=1733212') && afterAlt.includes('j=1733211') && afterHome.includes('j=1733205') && $('zoomLabel').textContent === 'Day', `${afterShift} ${afterAlt} ${afterHome}`);

    // T-UI-10: reference markers and today present at a suitable zoom
    await setHash('#j=1733205&z=millennium');
    const markers = [...d.querySelectorAll('#rows .marker')].map(m => m.getAttribute('aria-label'));
    record('T-UI-10', 'markers visible at millennium zoom around #1: Sabbath #1, Sabbath #0, 1582 reform, 1 BC → AD 1, Today', ['Sabbath #1', 'Sabbath #0', '1582 reform', '1 BC → AD 1', 'Today'].every(l => markers.some(m => m.startsWith(l))), markers.join('; '));

    // T-UI-11: certainty badges on every calendar row
    const badges = [...d.querySelectorAll('#rows :is(.row-julian, .row-gregorian, .row-hebrew, .row-chinese) .cert')].map(b => b.textContent);
    record('T-UI-11', 'each calendar row shows a certainty badge for the cursor day', badges.length === 4 && badges.every(b => ['exact', 'conventional', 'approximate', 'unsupported'].includes(b)), badges.join(', '));

    // T-UI-14: ARIA structure
    const rowsAria = d.querySelectorAll('#rows g.row[role=list]').length, itemsAria = d.querySelectorAll('#rows [role=listitem][aria-label]').length;
    record('T-UI-14', 'rows have role=list and ticks role=listitem with labels; cursor card is a live region', rowsAria >= 5 && itemsAria > 0 && $('cursorCard').getAttribute('aria-live') === 'polite', `${rowsAria} rows, ${itemsAria} items`);

    // T-UI-12/08: narrow layout collapses Hebrew/Chinese rows by default (checked via the app's own media query logic)
    record('T-UI-08', 'narrow-viewport defaults (verified separately in a 375 px viewport; here: rows menu has 8 row toggles)', d.querySelectorAll('.rows-list input').length === 8);

    // T-UI-15: Bible events row — the Exodus band (Ussher, 1491 BC) at week zoom, with the cursor card listing all four systems
    await setHash('#j=1176987&z=week');
    const exodus = d.querySelector('#rows .row-events .evt[aria-label^="The Exodus"]');
    const cardHasSystems = ['Ussher', 'Seder Olam', 'Early-date', 'Historical'].every(s => cardText().includes(s));
    record('T-UI-15', 'Bible events row shows the Exodus band at week zoom in 1491 BC; cursor card lists the four systems', !!exodus && exodus.getAttribute('aria-label').includes('1491 BC') && cardHasSystems, exodus ? exodus.getAttribute('aria-label') : 'no .evt');

    // T-UI-16: calculated eclipses — collapsed at century zoom, individual ticks at year zoom (canon loads lazily)
    await setHash('#j=2457987&z=century');
    const canonReady = await waitFor(() => d.querySelector('#rows .row-eclipses .collapsed-reason') && d.querySelector('#rows .row-eclipses .collapsed-reason').textContent.includes('eclipses in view'), 15000);
    await setHash('#j=2457987&z=year');
    const ticks = d.querySelectorAll('#rows .row-eclipses .ecl').length;
    const total2017 = d.querySelector('#rows .row-eclipses .ecl[aria-label^="☉ Total solar eclipse, Monday 21 August 2017"]');
    record('T-UI-16', `calculated-eclipse row collapses at century zoom and shows ${ticks} ticks at year zoom including 21 Aug 2017`, canonReady && ticks >= 60 && ticks <= 400 && !!total2017);

    // T-UI-17: recorded eclipses — Eddington 1919 and the Great American eclipse at decade zoom; cursor card shows the eclipse of the day
    await setHash('#j=2457987&z=decade');
    const rec = [...d.querySelectorAll('#rows .row-recorded .ecl')].map(e => e.getAttribute('aria-label'));
    record('T-UI-17', 'recorded-eclipse row shows Eddington 1919 and 2017 at decade zoom; cursor card describes the 2017 eclipse with ΔT', rec.some(l => l.startsWith('Eddington')) && rec.some(l => l.startsWith('Great American')) && cardText().includes('Total solar eclipse') && cardText().includes('ΔT = 70 s'), rec.join('; '));

    // T-UI-18: Go to… Bible event (Ussher → Exodus) lands on the first day of 1491 BC with a note in the preview
    $('gotoBtn').click(); await waitFor(() => $('gotoDialog').open);
    const r = d.querySelector('#gotoModes input[value="event"]'); r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true }));
    await waitFor(() => d.querySelector('#gotoFields select[name=event]'));
    d.querySelector('#gotoFields select[name=system]').value = 'ussher';
    d.querySelector('#gotoFields select[name=event]').value = 'exodus';
    d.querySelector('#gotoFields select[name=event]').dispatchEvent(new Event('change', { bubbles: true }));
    const evPreviewOk = await waitFor(() => $('gotoPreview').textContent.includes('1491 BC') && $('gotoPreview').textContent.includes('Annals'));
    $('gotoGo').click(); await waitFor(() => w.location.hash.includes('j=1176836'));
    record('T-UI-18', 'Go to… Bible event: Ussher/Exodus previews "1491 BC" with its basis and jumps to JDN 1,176,836 (1 Jan 1491 BC Julian)', evPreviewOk && w.location.hash.includes('j=1176836'), w.location.hash);
  } catch (e) {
    record('harness', 'unexpected error', false, String(e && e.stack || e));
  }
  const failed = results.filter(r => !r.ok).length;
  const st = document.getElementById('status');
  st.textContent = failed ? `${failed} of ${results.length} checks FAILED` : `ALL ${results.length} CHECKS PASSED`;
  st.className = failed ? 'fail' : 'pass';
  window.__smoke = results;
</script>
</body>
</html>
